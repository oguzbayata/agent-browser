<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Bridge</title>
    <link rel="stylesheet" href="extensions.css" />
    <link rel="stylesheet" href="memory-bridge.css" />
    <link rel="stylesheet" href="hide-scrollbars.css" />
  </head>
  <body>
    <header class="ext-top">
      <img class="ext-logo" src="assets/agent-browser-logo.svg" width="28" height="28" alt="" />
      <h1>Memory Bridge</h1>
      <p class="mem-kicker">SESSION ONLY · RAM</p>
    </header>

    <main class="mem-main">
      <p id="mem-status" class="mem-status">no bridge selected</p>
      <div class="ext-grid" id="mem-grid"></div>

      <form class="mem-form" id="mem-form" autocomplete="off">
        <label id="mem-endpoint-row">
          <span>Endpoint (localhost only)</span>
          <input id="mem-endpoint" type="url" spellcheck="false" placeholder="http://127.0.0.1:6806/api/..." />
        </label>
        <label id="mem-token-row">
          <span>Session key / token</span>
          <input id="mem-token" type="password" spellcheck="false" placeholder="this session only · not written to disk" />
        </label>
        <div id="mem-vault-row" hidden>
          <span>Obsidian vault</span>
          <div class="mem-vault-row">
            <p id="mem-vault-path">no folder selected</p>
            <button type="button" class="ext-btn" id="mem-pick-vault">Choose folder</button>
          </div>
        </div>
        <button type="submit" class="ext-btn mem-save">Save</button>
      </form>
    </main>
    <script src="memory-bridge.js"></script>
  </body>
</html>
