<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Search</title>
    <link rel="stylesheet" href="search.css" />
    <link rel="stylesheet" href="hide-scrollbars.css" />
  </head>
  <body>
    <main class="search-shell">
      <p class="kicker">local intelligence agent · stdout json · ram</p>
      <h1 id="query-title">Search</h1>
      <p id="status" class="status">Agent running…</p>
      <p id="error" class="error" hidden></p>
      <ol id="results" class="results" aria-live="polite"></ol>
      <nav id="pager" class="pager" hidden aria-label="Search pages"></nav>
    </main>
    <script src="search.js"></script>
  </body>
</html>
