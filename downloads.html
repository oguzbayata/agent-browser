<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Downloads</title>
    <link rel="stylesheet" href="downloads.css" />
    <link rel="stylesheet" href="hide-scrollbars.css" />
  </head>
  <body>
    <main class="downloads-shell">
      <p class="kicker">session list · ram</p>
      <h1>Downloads</h1>
      <p class="lede">Files downloaded in this session appear here. The list is cleared on close; files stay in your Downloads folder.</p>
      <p id="disk-warning" class="disk-warning" hidden role="status"></p>
      <p id="downloads-empty" class="empty">No downloads yet.</p>
      <div id="downloads-list" class="list" aria-live="polite"></div>
    </main>
    <script src="downloads.js"></script>
  </body>
</html>
