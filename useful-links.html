<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Useful Links</title>
    <link rel="stylesheet" href="useful-links.css" />
    <link rel="stylesheet" href="hide-scrollbars.css" />
  </head>
  <body>
    <main class="intel">
      <header class="intel-head">
        <img
          class="brand-mark"
          src="assets/agent-browser-logo.svg"
          width="72"
          height="72"
          alt=""
        />
        <p class="kicker">in-memory · no persist</p>
        <h1>Useful Links</h1>
        <p class="lede" id="useful-bound">
          Live GitHub catalog — popular, new, and recently updated. Type a keyword to add another live column.
        </p>
        <p class="status" id="useful-status"></p>
        <div class="intel-actions">
          <button type="button" class="intel-btn" id="useful-refresh">Find current repos</button>
          <form class="intel-add-section" id="useful-add-section">
            <label>
              <span class="sr-only">Section title</span>
              <input name="title" type="text" placeholder="Keyword — rust, privacy, game…" maxlength="80" required />
            </label>
            <button type="submit">Add section</button>
          </form>
        </div>
      </header>

      <section class="catalog" id="useful-catalog" aria-label="Open-source library"></section>
    </main>
    <script src="useful-links-seed.js"></script>
    <script src="useful-links.js"></script>
  </body>
</html>
