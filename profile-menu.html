<!DOCTYPE html>
<html lang="en" class="overflow-surface">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'none'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAM profile</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="hide-scrollbars.css" />
  </head>
  <body class="overflow-surface">
    <div id="agent-profile-menu" class="dropdown-menu" role="menu" aria-label="RAM profile">
      <div class="menu-heading">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7.2" r="3"/><path d="M4.4 16.2c.8-3.2 2.8-4.8 5.6-4.8s4.8 1.6 5.6 4.8"/></svg>
        <span class="menu-profile-copy">
          <strong>RAM profile</strong>
        </span>
        <em class="menu-signed">session · ram</em>
      </div>
      <hr />
      <div class="menu-item menu-stat" role="menuitem">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.2"/><path d="M10 7.2v3.2M10 13.2h.01"/></svg>
        <span>No session account</span>
      </div>
      <p class="menu-caption">Cookies, bookmarks, and keys are not written to disk. They are wiped on close.</p>
      <hr />
      <button type="button" class="menu-item" data-action="settings" role="menuitem">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.2"/><path d="M10 3.4v1.6M10 15v1.6M3.4 10h1.6M15 10h1.6M5.3 5.3l1.1 1.1M13.6 13.6l1.1 1.1M5.3 14.7l1.1-1.1M13.6 6.4l1.1-1.1"/></svg>
        <span>Settings</span>
      </button>
      <button type="button" class="menu-item" data-action="exit" role="menuitem">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.2"/><path d="M10 6.2v4"/></svg>
        <span>Excommunicado</span>
      </button>
    </div>
    <script src="profile-menu.js"></script>
  </body>
</html>
